<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary SEO -->
<title>All Articles | Anveshana.net — Latest AI News, Tech News & Science Research</title>
<meta name="description" content="Browse every article on Anveshana.net — the latest AI news, science research, and biotechnology breakthroughs, all in one place.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Anveshana.net">
<link rel="canonical" href="https://www.anveshana.net/archive.html">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Anveshana.net">
<meta property="og:url" content="https://www.anveshana.net/archive.html">
<meta property="og:title" content="All Articles | Anveshana.net">
<meta property="og:description" content="Browse every article on Anveshana.net — the latest AI news, science research, and biotechnology breakthroughs, all in one place.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .archive-page{ max-width: 880px; margin: 0 auto; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 24px) 80px; }

  .archive-head{ margin-bottom: 34px; }
  .archive-head h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(1.9rem, 3.6vw, 2.6rem);
    margin: 0 0 10px;
    color: var(--ink);
  }
  .archive-head p{
    color: var(--ink-soft);
    font-size: 1rem;
    max-width: 56ch;
    margin: 0;
  }
  .archive-count{
    display:inline-block;
    margin-top: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pen-blue);
    background: rgba(58,79,224,0.08);
    border: 1px solid rgba(58,79,224,0.18);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .archive-list{
    display:flex;
    flex-direction: column;
    gap: 16px;
  }

  .archive-item{
    display:flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px 22px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(59,49,140,0.05);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .archive-item:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(59,49,140,0.12);
    border-color: var(--violet);
  }

  .archive-item-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .archive-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--discovery-amber);
    background: rgba(255,122,61,0.1);
    border: 1px solid rgba(255,122,61,0.25);
    border-radius: 20px;
    padding: 3px 10px;
  }

  .archive-date{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  .archive-item h2{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.2rem;
    line-height: 1.3;
    margin: 2px 0 2px;
    color: var(--ink);
  }

  .archive-item p{
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.03em;
    color: var(--pen-blue); text-decoration:none; margin-bottom: 28px;
  }
  .back-link:hover{ color: var(--discovery-amber); }
</style>
</head>
<body>
<div class="site">

  <header class="masthead">
    <div class="brand-row">
      <a href="/" style="display:contents; text-decoration:none;">
        <div class="discovery-mark" aria-hidden="true">
          <div class="ring"></div>
          <div class="core"></div>
        </div>
      </a>
      <div class="brand-block">
        <a href="/" style="text-decoration:none;"><div class="site-name">Anveshana<span class="dot">.</span>net</div></a>
        <div class="tagline">Anveshan — Where Curiosity Meets Discovery</div>
      </div>
    </div>
    <nav class="menu">
      <a href="/">Home</a>
      <a href="/archive.html">Articles</a>
      <a href="/#ai">AI</a>
      <a href="/#science">Science</a>
    </nav>
  </header>

  <main class="archive-page">
    <a class="back-link" href="/">&larr; Back to Anveshana.net</a>

    <div class="archive-head">
      <h1>All Articles</h1>
      <p>Every scholarly article published on Anveshana.net, newest first.</p>
      <span class="archive-count">{{ARTICLE_COUNT}} articles</span>
    </div>

    <div class="archive-list">
{{ARCHIVE_ITEMS}}
    </div>
  </main>

  <footer class="site-footer">
    <span>© 2026 Anveshana.net</span>
    <span>Research &amp; News in AI · Science · Biotech</span>
  </footer>

</div>
</body>
</html>
